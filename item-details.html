<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Details - TransitFind</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">
    <div class="logo">
        <span>Transit</span>Find
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="search.html">Search</a>
        <a href="login.html" class="login-btn">Login</a>
    </nav>
</header>

<main class="page-container">
    <div class="page-title">
        <p class="section-tag">ITEM DETAILS</p>
        <h1>Black Backpack</h1>
        <p>Status: Found Item</p>
    </div>

    <div class="form-card">
        <div class="item-image" style="height:220px; border-radius: 12px;">🎒</div>
        <br>

        <div class="form-grid">
            <div class="form-group">
                <label>Item Name</label>
                <p><strong>Black Backpack</strong></p>
            </div>

            <div class="form-group">
                <label>Category</label>
                <p>Bag</p>
            </div>

            <div class="form-group">
                <label>Color</label>
                <p>Black</p>
            </div>

            <div class="form-group">
                <label>Date & Time Found</label>
                <p>25 September 2026 at 14:30 IST</p>
            </div>

            <div class="form-group">
                <label>Transport Mode / Vehicle</label>
                <p>Bus 24</p>
            </div>

            <div class="form-group">
                <label>Station Stop / Location</label>
                <p>Panjim Bus Stand</p>
            </div>

            <div class="form-group full">
                <label>Description</label>
                <p>Black backpack with two main zipper compartments. Contains a college notebook and a blue water bottle.</p>
            </div>
        </div>

        <br>
        <a href="claim.html" class="btn primary">Claim This Item</a>
    </div>
</main>

</body>
</html>
