<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard - TransitFind</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

<header class="navbar">

    <div class="logo">
        <span>Transit</span>Find
    </div>

    <nav>

        <a href="index.html">Home</a>
        <a href="search.html">Search</a>
        <a href="report-lost.html">Report Lost</a>
        <a href="report-found.html">Report Found</a>

    </nav>

</header>


<main class="dashboard">

    <div class="dashboard-header">

        <h1>My Dashboard</h1>

        <p>
            Manage your reported items and claims.
        </p>

    </div>


    <div class="dashboard-stats">

        <div class="stat-card">

            <h3>2</h3>

            <p>
                Lost Items
            </p>

        </div>


        <div class="stat-card">

            <h3>1</h3>

            <p>
                Found Items
            </p>

        </div>


        <div class="stat-card">

            <h3>1</h3>

            <p>
                Active Claims
            </p>

        </div>

    </div>


    <div class="form-card">

        <h2>
            My Reported Items
        </h2>

        <br>


        <div class="item-grid">

            <div class="item-card">

                <div class="item-image">
                    🎒
                </div>

                <div class="item-content">

                    <h3>
                        Black Backpack
                    </h3>

                    <p>
                        Lost • Bus 24
                    </p>

                    <span class="status lost">
                        Searching
                    </span>

                </div>

            </div>


            <div class="item-card">

                <div class="item-image">
                    👛
                </div>

                <div class="item-content">

                    <h3>
                        Brown Wallet
                    </h3>

                    <p>
                        Found • Station
                    </p>

                    <span class="status found">
                        Reported
                    </span>

                </div>

            </div>

        </div>

    </div>

</main>

</body>

</html>
