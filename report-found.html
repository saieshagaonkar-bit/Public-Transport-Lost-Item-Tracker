<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Report Found Item - TransitFind</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

<header class="navbar">

    <div class="logo">
        <span>Transit</span>Find
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="report-lost.html">
            Report Lost
        </a>

        <a href="report-found.html" class="active">
            Report Found
        </a>

        <a href="search.html">
            Search
        </a>

    </nav>

</header>


<main class="page-container">

    <div class="page-title">

        <p class="section-tag">
            HELP SOMEONE
        </p>

        <h1>Report a Found Item</h1>

        <p>
            Found something on public transport? Help return it to its owner.
        </p>

    </div>


    <div id="foundAlert" class="alert"></div>


    <form id="foundItemForm" class="form-card">

        <div class="form-grid">

            <div class="form-group">

                <label>
                    Item Name *
                </label>

                <input
                    type="text"
                    id="foundItemName"
                    placeholder="e.g. Blue Wallet"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Category *
                </label>

                <select id="foundCategory" required>

                    <option value="">
                        Select category
                    </option>

                    <option>Bag</option>
                    <option>Electronics</option>
                    <option>Wallet</option>
                    <option>Documents</option>
                    <option>Clothing</option>
                    <option>Keys</option>
                    <option>Other</option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Color
                </label>

                <input
                    type="text"
                    id="foundColor"
                    placeholder="e.g. Blue"
                >

            </div>


            <div class="form-group">

                <label>
                    Date Found *
                </label>

                <input
                    type="date"
                    id="dateFound"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Transport Type *
                </label>

                <select id="foundTransport" required>

                    <option value="">
                        Select transport
                    </option>

                    <option>Bus</option>
                    <option>Train</option>
                    <option>Metro</option>
                    <option>Station</option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Bus / Train Number
                </label>

                <input
                    type="text"
                    id="foundVehicle"
                    placeholder="e.g. Bus 24"
                >

            </div>


            <div class="form-group full">

                <label>
                    Found Location
                </label>

                <input
                    type="text"
                    id="foundLocation"
                    placeholder="Where did you find the item?"
                >

            </div>


            <div class="form-group full">

                <label>
                    Description *
                </label>

                <textarea
                    id="foundDescription"
                    placeholder="Describe the item..."
                    required
                ></textarea>

            </div>


            <div class="form-group full">

                <label>
                    Upload Image
                </label>

                <input
                    type="file"
                    accept="image/*"
                >

            </div>

        </div>


        <div class="form-submit">

            <button
                type="submit"
                class="btn primary"
            >
                Submit Found Item
            </button>

        </div>

    </form>

</main>


<script src="js/items.js"></script>

</body>

</html>
