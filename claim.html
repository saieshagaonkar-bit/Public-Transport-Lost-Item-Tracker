<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Claim Item - TransitFind</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

<header class="navbar">

    <div class="logo">
        <span>Transit</span>Find
    </div>

    <nav>

        <a href="index.html">Home</a>
        <a href="search.html">Search</a>
        <a href="dashboard.html">Dashboard</a>
    </nav>

</header>


<main class="page-container">

    <div class="page-title">

        <p class="section-tag">
            RECOVER ITEM
        </p>

        <h1>Submit a Claim</h1>

        <p>
            Provide information to help verify that this item belongs to you.
        </p>

    </div>


    <div id="claimAlert" class="alert"></div>


    <form id="claimForm" class="form-card">

        <div class="form-grid">

            <div class="form-group">

                <label>
                    Your Name *
                </label>

                <input
                    type="text"
                    id="claimName"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Phone Number *
                </label>

                <input
                    type="tel"
                    id="claimPhone"
                    required
                >

            </div>


            <div class="form-group full">

                <label>
                    Why do you believe this item belongs to you? *
                </label>

                <textarea
                    id="claimReason"
                    placeholder="Provide details only the owner would know..."
                    required
                ></textarea>

            </div>


            <div class="form-group full">

                <label>
                    Additional Proof / Information
                </label>

                <textarea
                    id="claimProof"
                    placeholder="Serial number, unique markings, contents, etc."
                ></textarea>

            </div>

        </div>


        <div class="form-submit">

            <button
                type="submit"
                class="btn primary"
            >
                Submit Claim
            </button>

        </div>

    </form>

</main>


<script src="js/items.js"></script>

</body>

</html>
